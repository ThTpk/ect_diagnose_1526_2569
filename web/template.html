<!doctype html>
<html lang="th">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ผังคำวินิจฉัย ๑๕๒๖/๒๕๖๙</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Noto+Serif+Thai:wght@600;700&display=swap">
<style>
/* Layout: three panes — section index (left), relation graph (centre), testimony ledger (right); stacks on phones */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --sunken:#e9ebef; --line:#d5d9e0; --fg:#18202c; --muted:#5b6575; --faint:#8a93a3;
  --accent:#28407a; --accent-soft:#e3e8f4;
  --k-testimony:#2f6fbf; --k-defense:#5f7f6a; --k-accusation:#c07a14; --k-action:#c4452c; --k-finding:#7a4bb0; --k-ruling:#8d1f2b; --m-out:#c62828; --m-in:#1e8e5a; --m-both:#ef6c00;
  --n-politic:#b3303b; --n-national:#3c5a9c; --n-province:#20857f; --n-district:#7b8a25; --n-unknown:#8a93a3;
  --n-witness:#d08a10; --n-person:#6b7280; --n-org:#2a2f38; --n-group:#9a6b3f;
  --font-ui:"IBM Plex Sans Thai",system-ui,"Leelawadee UI","Tahoma",sans-serif;
  --font-head:"Noto Serif Thai","IBM Plex Sans Thai",Georgia,serif;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161d; --surface:#1a1f28; --sunken:#222833; --line:#2e3644; --fg:#e6e9ef; --muted:#a3acbb; --faint:#6f7888;
  --accent:#9db4ef; --accent-soft:#25304a;
  --k-testimony:#6aa7ee; --k-defense:#8fb59c; --k-accusation:#e3a447; --k-action:#ef7a60; --k-finding:#b48ae6; --k-ruling:#e0697a; --m-out:#f26b5b; --m-in:#4cc38a; --m-both:#ff9a3c;
  --n-politic:#e0606b; --n-national:#7e9be0; --n-province:#4fc0b8; --n-district:#b3c24f; --n-unknown:#8a93a3;
  --n-witness:#f0b445; --n-person:#9aa3b2; --n-org:#d8dde6; --n-group:#c9996b;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161d; --surface:#1a1f28; --sunken:#222833; --line:#2e3644; --fg:#e6e9ef; --muted:#a3acbb; --faint:#6f7888;
  --accent:#9db4ef; --accent-soft:#25304a;
  --k-testimony:#6aa7ee; --k-defense:#8fb59c; --k-accusation:#e3a447; --k-action:#ef7a60; --k-finding:#b48ae6; --k-ruling:#e0697a; --m-out:#f26b5b; --m-in:#4cc38a; --m-both:#ff9a3c;
  --n-politic:#e0606b; --n-national:#7e9be0; --n-province:#4fc0b8; --n-district:#b3c24f; --n-unknown:#8a93a3;
  --n-witness:#f0b445; --n-person:#9aa3b2; --n-org:#d8dde6; --n-group:#c9996b;
  color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:14px;line-height:1.55}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:300px minmax(0,1fr) 380px;grid-template-rows:auto minmax(0,1fr);height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;gap:12px}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px}
header h1{font-family:var(--font-head);font-size:20px;margin:0;text-wrap:balance}
header .sub{color:var(--muted);font-size:13px}
.pane{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-height:0;min-width:0;display:flex;flex-direction:column}
.pane-h{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600}
.scroll{overflow:auto;min-height:0;flex:1}

input[type=search]{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--sunken)}
.toc{padding:6px 6px 12px}
.cat{margin-top:8px}
.cat>.cat-h{display:flex;align-items:center;gap:6px;width:100%;padding:6px 6px;background:none;border:0;cursor:pointer;text-align:left;font-weight:600;font-family:var(--font-head);font-size:14px}
.cat>.cat-h .chev{transition:transform .15s;color:var(--faint);font-size:10px;width:10px}
.cat.closed>.cat-h .chev{transform:rotate(-90deg)}
.cat.closed>.items{display:none}
.sec{display:flex;align-items:flex-start;gap:8px;width:100%;padding:5px 8px;border:0;background:none;text-align:left;cursor:pointer;border-radius:6px;color:var(--fg)}
.sec:hover{background:var(--sunken)}
.sec[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.sec .t{flex:1;min-width:0}
.sec .n{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;padding-top:2px}
.sec.child{padding-left:26px;font-size:13px}
.sec.hidden{display:none}

.graph-pane{position:relative;overflow:hidden}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border:1px solid var(--line);border-radius:999px;background:var(--surface);cursor:pointer;font-size:12.5px;user-select:none}
.chip .sw{width:14px;height:3px;border-radius:2px}
.chip[aria-pressed="false"]{opacity:.45}
.chip[aria-pressed="false"] .sw{background:var(--faint)!important}
.secinfo{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.secinfo h2{font-family:var(--font-head);font-size:16px;margin:0;text-wrap:balance}
.secinfo p{margin:0;color:var(--muted);max-width:80ch}
.secinfo .meta{font-size:12px;color:var(--faint)}
svg#g{flex:1;width:100%;min-height:0;display:block;cursor:grab}
svg#g:active{cursor:grabbing}
/* legend + zoom buttons sit in their own strip under the chart, so they never cover it */
.gfoot{flex:none;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px;padding:6px 10px;border-top:1px solid var(--line);background:var(--surface)}
.legend{flex:1 1 300px;min-width:0;font-size:11.5px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;padding:2px 0}
.legend span{display:inline-flex;align-items:center;gap:5px;color:var(--muted)}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.zoombtns{flex:none;display:flex;gap:4px;margin-left:auto}
.legtog{display:none;align-items:center;gap:6px;height:32px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg);cursor:pointer;font-size:13px}
.legtog .chev{transition:transform .15s}
.legtog[aria-expanded="true"] .chev{transform:rotate(180deg)}
.zoombtns button{width:32px;height:32px;border:1px solid var(--line);background:var(--surface);border-radius:6px;cursor:pointer;font-size:16px}
.zoombtns button.wide{width:auto;padding:0 10px;font-size:13px;font-weight:600}
.zoombtns button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
/* full screen: the graph takes the whole window, the detail panel stays beside it */
.app.gfull{grid-template-columns:minmax(0,1fr) 360px;grid-template-rows:minmax(0,1fr);height:100vh;height:100dvh;padding-block:8px}
.app.gfull>header,.app.gfull>.left{display:none}
.app.gfull>.right{grid-column:auto}
@media (max-width:900px){ .app.gfull{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) 34vh} .app.gfull>.right{grid-column:1} }
.empty{position:absolute;inset:auto 0 45% 0;text-align:center;color:var(--faint)}

.node circle,.node rect{stroke:var(--surface);stroke-width:1.5px;cursor:pointer}
.node.witness circle{fill:var(--surface)!important;stroke-width:2.5px}
.node text{font-size:11px;fill:var(--fg);paint-order:stroke;stroke:var(--surface);stroke-width:3px;pointer-events:none}
.node.dim,.link.dim{opacity:.12}
.node.sel circle,.node.sel rect{stroke:var(--fg);stroke-width:3px}
.node.self circle{stroke-dasharray:2 2}
.link{fill:none;cursor:pointer}
.link:hover{stroke-opacity:1}

.detail{padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.detail h3{font-family:var(--font-head);font-size:17px;margin:0;text-wrap:balance}
.detail .role{color:var(--muted);font-size:13px}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid currentColor;font-weight:600;white-space:nowrap}
.group-h{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:4px;margin-top:4px}
.group-h b{font-size:13px}
.group-h span{font-size:12px;color:var(--faint)}
.stmt{border-left:3px solid var(--line);padding:2px 0 2px 10px;display:flex;flex-direction:column;gap:3px}
.stmt .who{font-size:12.5px;color:var(--muted)}
.stmt .who button{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;font-weight:600;text-align:left}
.stmt .txt{margin:0;font-size:13.5px}
.pg{display:inline-block;font-weight:600;color:var(--fg);background:var(--sunken);border-radius:4px;padding:0 6px;font-variant-numeric:tabular-nums}
.orders .pg{margin-right:4px}
.stmt .src{font-size:11.5px;color:var(--faint)}
.stmt .src button{border:0;background:none;padding:0;color:var(--faint);cursor:pointer;text-decoration:underline dotted}
.orders{background:var(--sunken);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.hint{color:var(--faint);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--sunken);border-radius:6px;padding:6px 8px}
.stats b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.stats span{font-size:11.5px;color:var(--muted)}
.tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:10px 6px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tabpanel{display:flex;flex-direction:column;min-height:0;flex:1}
.tabpanel[hidden]{display:none}
.pplbar{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pplbar select{padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--sunken);font-size:12.5px;min-width:0}
.pplnote{font-size:12px;color:var(--faint)}
.ppl{padding:4px 6px 12px}
.prow{display:flex;flex-direction:column;gap:3px;padding:6px 8px;border-radius:6px}
.prow:hover{background:var(--sunken)}
.prow.on{background:var(--accent-soft)}
.prow .pname{border:0;background:none;padding:0;text-align:left;cursor:pointer;font-weight:600;color:var(--fg)}
.prow .pname small{display:block;font-weight:400;font-size:11.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .pdir{display:flex;gap:6px}
.prow .pdir button,.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:1px 9px;font-size:12px;cursor:pointer;font-variant-numeric:tabular-nums}
.prow .pdir button:disabled{opacity:.4;cursor:default}
.prow .pdir button:not(:disabled):hover,.seg button:hover{border-color:var(--accent);color:var(--accent)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.pgrp{display:flex;flex-direction:column;gap:8px}
.pgrp .group-h button{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;font-weight:600;font-size:13px;text-align:left}
.outcome{border:1px solid var(--line);border-left:4px solid var(--k-ruling);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.outcome h4{margin:0;font-family:var(--font-head);font-size:15px}
.outcome .sub{font-size:12px;color:var(--faint);font-weight:600;margin-top:2px}
.outcome .note{font-size:12.5px;color:var(--muted)}
.outcome .note button{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;font-weight:600;text-align:left}
.outcome .item{font-size:13px;display:flex;gap:6px;align-items:baseline}
.outcome .item .q{cursor:pointer;border-radius:4px}
.outcome .item .q:hover{background:var(--sunken)}
.otags{display:flex;flex-wrap:wrap;gap:5px}
.otag{font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.otag.sc{color:var(--k-ruling)} .otag.cr{color:var(--k-action)} .otag.dm{color:var(--k-defense)} .otag.ev{color:var(--k-finding)} .otag.nf{color:var(--muted)}
.sec .otags{margin-top:3px} .sec .otag{font-size:10.5px;padding:0 6px;font-weight:500}
.sec .tt{flex:1;min-width:0;display:flex;flex-direction:column}
.more{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 10px;cursor:pointer;align-self:flex-start}

/* source viewer: the scanned PDF page with the quoted passage highlighted */
.viewer{position:fixed;top:0;right:0;bottom:0;width:min(780px,100vw);z-index:20;background:var(--surface);border-left:1px solid var(--line);
  box-shadow:-12px 0 32px rgba(0,0,0,.18);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.viewer[hidden]{display:none}
.vbar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.vbar h4{margin:0;font-family:var(--font-head);font-size:15px;flex:1;min-width:160px}
.vbar button{border:1px solid var(--line);background:var(--surface);border-radius:6px;height:32px;min-width:32px;padding:0 8px;cursor:pointer}
.vbar button:disabled{opacity:.4;cursor:default}
.vquote{padding:8px 12px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted);max-height:96px;overflow:auto;background:var(--sunken)}
.vquote[hidden]{display:none}
.vbody{flex:1;min-height:0;overflow:auto;background:var(--sunken);padding:12px}
.vpage{position:relative;margin:0 auto;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.vpage img{display:block;width:100%;max-width:none;height:auto}
.hl{position:absolute;background:rgba(255,196,0,.38);mix-blend-mode:multiply;border-radius:2px;outline:1px solid rgba(214,150,0,.55)}
.vnote{font-size:12px;color:var(--faint);padding:6px 12px;border-top:1px solid var(--line)}
@media (max-height:640px){ .vnote{display:none} .vquote{max-height:52px} .vbar{padding:6px 10px} }
.srcbtn{cursor:pointer}
blockquote.txt{cursor:pointer;border-radius:4px}
blockquote.txt:hover{background:var(--sunken)}
button.pg{border:0;cursor:pointer}
button.pg:hover{background:var(--accent-soft);color:var(--accent)}
.nameBtn{border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left;text-decoration:underline dotted;text-underline-offset:4px}

/* view switch + money-flow graph */
.modes{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-left:auto;background:var(--surface)}
.modes button{border:0;background:none;padding:5px 14px;cursor:pointer;font-weight:600;color:var(--muted)}
.modes button+button{border-left:1px solid var(--line)}
.modes button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.toolbar[hidden]{display:none}
.allbtns{display:inline-flex;gap:4px}
.allbtns button{border:1px dashed var(--line);background:var(--surface);border-radius:999px;padding:2px 10px;font-size:12px;cursor:pointer;color:var(--muted)}
.allbtns button:not(:disabled):hover{border-color:var(--accent);color:var(--accent)}
.allbtns button:disabled{opacity:.4;cursor:default}
.mlink{cursor:pointer}
.mlink .mline{fill:none}
.mlink:hover .mline{stroke-opacity:1}
.mamt{font-size:10.5px;font-weight:600;fill:var(--muted);text-anchor:middle;paint-order:stroke;stroke:var(--surface);stroke-width:3px;font-variant-numeric:tabular-nums}
.mlink .dim,.mamt.dim{opacity:.1}
.otag.mev{color:var(--k-action)}
.amt{font-variant-numeric:tabular-nums}
.stats b.neg{color:var(--k-action)}
.mrow{display:flex;justify-content:space-between;gap:8px;font-size:13px;align-items:baseline}
.mrow button{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;font-weight:600;text-align:left}
.mrow span{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}

/* timeline view: time on the x axis, one swimlane per group of people */
#g[hidden],#t[hidden]{display:none}
svg#t{flex:1;width:100%;min-height:0;display:block;cursor:grab;touch-action:none}
svg#t:active{cursor:grabbing}
.tlane-bg{fill:var(--sunken);opacity:.55}
.tlane-sep{stroke:var(--line)}
.tlane-l rect{fill:var(--surface)}
.tlane-l .l1{font-size:12px;font-weight:600;fill:var(--fg)}
.tlane-l .l2{font-size:11px;fill:var(--muted)}
.tax text{font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}
.tax path,.tgrid path{display:none}
.tax line{stroke:var(--line)}
.tgrid line{stroke:var(--line);stroke-opacity:.7}
.tmile line{stroke:var(--fg);stroke-width:1.2;stroke-dasharray:4 3;opacity:.5}
.tmile text{font-size:11px;font-weight:600;fill:var(--fg);paint-order:stroke;stroke:var(--surface);stroke-width:3px;cursor:pointer}
.tmile.off text{display:none}
.tdot{cursor:pointer;stroke:var(--surface);stroke-width:1}
.tdot.dim{opacity:.13}
.tdot.hot{stroke:var(--fg);stroke-width:2}
.tbar{opacity:.4}
.tbar.dim{opacity:.06}
.tconn{stroke:var(--fg);stroke-width:1.5;stroke-dasharray:2 2;pointer-events:none}
.tkin{fill:none;stroke-width:1.6;stroke-opacity:.6;pointer-events:none}
.tdot.kin{stroke:var(--fg);stroke-width:1.4}
.tdot.faint{opacity:.28}
.tname{font-size:11px;fill:var(--fg);pointer-events:none;paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
.tname.hot{font-weight:700}
.tmore{font-size:10px;font-weight:600;fill:var(--muted);cursor:pointer;paint-order:stroke;stroke:var(--surface);stroke-width:3px}
.tdate{font-variant-numeric:tabular-nums}
.tday{display:flex;flex-direction:column;gap:6px}
.trow{display:flex;justify-content:space-between;gap:8px;font-size:13px;align-items:baseline}
.trow button{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;font-weight:600;text-align:left}
.trow span{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.stmt .src button.tf{color:var(--accent)}

@media (max-width:1100px){
  .app{grid-template-columns:260px minmax(0,1fr);grid-template-rows:auto minmax(640px,80vh) auto;height:auto}
  .right{grid-column:1/-1}
}
@media (max-width:720px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .left .scroll{max-height:300px}
  svg#g,svg#t{min-height:440px}
  .legtog{display:inline-flex}
  .gfoot .legend{order:3;flex-basis:100%}
  .gfoot:not(.open) .legend{display:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="app">
  <header>
    <h1>ใครพูดถึงใคร ในคำวินิจฉัย กกต. ที่ ๑๕๒๖/๒๕๖๙</h1>
    <span class="sub">การเลือกสมาชิกวุฒิสภา พ.ศ. ๒๕๖๗ · ผู้ถูกร้อง ๔๒๗ ราย · ถอดจากเอกสาร ๑๑๔ หน้า</span>
    <div class="modes" role="group" aria-label="มุมมองกราฟ">
      <button id="mode-rel" aria-pressed="true">ความเชื่อมโยง</button>
      <button id="mode-money" aria-pressed="false">เส้นทางการเงิน</button>
      <button id="mode-time" aria-pressed="false">ลำดับเวลา</button>
    </div>
  </header>

  <aside class="pane left">
    <div class="tabs" role="tablist" aria-label="เลือกรายการ">
      <button role="tab" id="tab-sec" aria-selected="true" aria-controls="panel-sec">ประเด็นที่พิจารณา</button>
      <button role="tab" id="tab-ppl" aria-selected="false" aria-controls="panel-ppl">รายชื่อบุคคล</button>
    </div>

<script>
(function(){
const D = JSON.parse(document.getElementById('data').textContent);
D.edges.forEach((e,i)=>e._i=i);
(D.orders||[]).forEach((o,i)=>o._i=i);
const RESP = new Map(D.respondents.map(r=>['R'+r.n, r]));
const TH = s => String(s).replace(/[0-9]/g, d => '๐๑๒๓๔๕๖๗๘๙'[d]);
const AR = s => String(s).replace(/[๐-๙]/g, d => '๐๑๒๓๔๕๖๗๘๙'.indexOf(d));
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

const KINDS = [
  ['testimony','ถ้อยคำพยาน'],['accusation','คำกล่าวหา'],['action','การกระทำ (โอนเงิน/สั่งการ)'],
  ['defense','คำชี้แจง'],['finding','ผลวินิจฉัย กกต.'],['ruling','คำสั่ง']
];
const KIND_LABEL = Object.fromEntries(KINDS);
const NODE_TYPES = [
  ['politic','พรรค/ผู้ดำรงตำแหน่งการเมือง'],['national','ผู้มีสิทธิเลือกระดับประเทศ'],['province','ผู้มีสิทธิเลือกระดับจังหวัด'],
  ['district','ผู้สมัครระดับอำเภอ'],['unknown','ผู้ถูกร้อง (ไม่ระบุสถานะ)'],['witness','พยาน'],['person','บุคคลอื่น'],['org','องค์กร/หน่วยงาน'],['group','กลุ่มผู้ถูกร้อง']
];

/* ---------- index data ---------- */
const ent = new Map();
D.respondents.forEach(r => ent.set('R'+r.n, {id:'R'+r.n, label:r.name, num:r.n, role:r.role, type:r.cls}));
D.entities.forEach(e => { if(!ent.has(e.id)) ent.set(e.id, Object.assign({}, e)); });
D.edges.forEach(e => { [e.from,e.to].forEach(id => { if(!ent.has(id)) ent.set(id,{id,label:id.replace(/^[A-Z]:/,''),type:id.startsWith('W:')?'witness':id.startsWith('O:')?'org':'person'}); }); });
const secs = new Map(D.sections.map(s => [s.id, s]));
const children = new Map();
D.sections.forEach(s => { if(s.parent){ if(!children.has(s.parent)) children.set(s.parent,[]); children.get(s.parent).push(s.id); } });
const descendants = id => { const out=[id]; (children.get(id)||[]).forEach(c => out.push(...descendants(c))); return out; };
const ordersBySec = new Map();
(D.orders||[]).forEach(o => { if(!ordersBySec.has(o.section)) ordersBySec.set(o.section,[]); ordersBySec.get(o.section).push(o); });
/* ---------- outcome of each case (all text verbatim from the document) ---------- */
const CONCL = /กรณีจึงมีหลักฐานอันควรเชื่อได้ว่า|ข้อเท็จจริงจึงรับฟังไม่ได้ว่า|ข้อเท็จจริงรับฟังไม่ได้ว่า/;
const ORDER_TAGS = [
  [/ศาลฎีกา/, 'sc', 'ยื่นศาลฎีกาให้เพิกถอนสิทธิ'],
  [/ดำเนินคดีอาญา/, 'cr', 'ดำเนินคดีอาญา'],
  [/ยกคำร้อง/, 'dm', 'ยกคำร้อง'],
];
function outcomeOwn(id){
  const ids=descendants(id), set=new Set(ids);
  const orders=ids.flatMap(x=>ordersBySec.get(x)||[]);
  const seen=new Set();
  const concl=D.edges.filter(e=>set.has(e.section) && e.kind==='finding' && CONCL.test(e.text) && !seen.has(e.text) && seen.add(e.text));
  const tags=[];
  ORDER_TAGS.forEach(([re,c,l])=>{ if(orders.some(o=>re.test(o.text))) tags.push([c,l]); });
  if(!orders.length && concl.length){
    if(concl.some(e=>/กรณีจึงมีหลักฐานอันควรเชื่อได้ว่า/.test(e.text))) tags.push(['ev','มีหลักฐานอันควรเชื่อ']);
    if(concl.some(e=>/รับฟังไม่ได้ว่า/.test(e.text))) tags.push(['nf','ข้อเท็จจริงรับฟังไม่ได้']);
  }
  return {id, orders, concl, tags};
}
function outcomeFor(id){
  const own=outcomeOwn(id);
  if(own.orders.length || own.concl.length) return own;
  // no decision of its own: look to the case it belongs to
  let p=secs.get(id)&&secs.get(id).parent;
  while(p){ const o=outcomeOwn(p); if(o.orders.length||o.concl.length) return Object.assign(o,{via:'parent'}); p=secs.get(p).parent; }
  if(/^a12-/.test(id) && id!=='a12-ruling' && secs.has('a12-ruling')) return Object.assign(outcomeOwn('a12-ruling'),{via:'a12'});
  return Object.assign(own,{via:'none'});
}
const tagHTML = tags => tags.length?`<div class="otags">${tags.map(([c,l])=>`<span class="otag ${c}">${l}</span>`).join('')}</div>`:'';
function outcomeHTML(id){
  const o=outcomeFor(id);
  let note='';
  if(o.via==='parent' || o.via==='a12') note=`<div class="note">ประเด็นนี้ไม่มีคำสั่งแยก · ผลการพิจารณาอยู่ใน <button data-sec="${esc(o.id)}">${esc(secTitle(o.id))}</button></div>`;
  if(o.via==='none') return `<div class="outcome"><h4>ผลการพิจารณา</h4><div class="note">${
    /^(intro|a37-intro)/.test(id) ? 'ส่วนนี้เป็นคำร้องรวมหรือหลักการพิจารณา ผลการพิจารณาอยู่ในแต่ละกรณี เลือกกรณีจากรายการด้านซ้าย' : 'ไม่พบคำสั่งหรือข้อสรุปของ กกต. ที่แยกไว้สำหรับประเด็นนี้ในข้อมูลที่ถอดไว้'}</div></div>`;
  const ord=o.orders.map(x=>`<div class="item"><button class="pg" data-o="${x._i}" title="เปิดในเอกสารต้นฉบับ">หน้า ${TH(x.page)}</button><span class="q" data-o="${x._i}">“${esc(x.text)}”</span></div>`);
  const con=o.concl.map(e=>`<div class="item"><button class="pg" data-e="${e._i}" title="เปิดในเอกสารต้นฉบับ">หน้า ${TH(e.page)}</button><span class="q" data-e="${e._i}" tabindex="0">“${esc(e.text)}”</span></div>`);
  const block=(title,arr,n)=>!arr.length?'':`<div class="sub">${title} · ${TH(arr.length)} รายการ</div>${arr.slice(0,n).join('')}${arr.length>n?`<div hidden style="display:contents">${arr.slice(n).join('')}</div><button class="more">แสดงอีก ${TH(arr.length-n)} รายการ</button>`:''}`;
  return `<div class="outcome"><h4>ผลการพิจารณา</h4>${tagHTML(o.tags)}${note}
    ${block('คำสั่งของ กกต.', ord, 8)}${block('ข้อสรุปจากการวินิจฉัย', con, o.orders.length?3:6)}</div>`;
}
const hashOf = id => id === '*' ? 'all' : 's-' + id.replace(/[^A-Za-z0-9]+/g,'-');
const idByHash = new Map(D.sections.map(s => [hashOf(s.id), s.id])); idByHash.set('all','*');

const edgeCount = new Map();
D.edges.forEach(e => edgeCount.set(e.section,(edgeCount.get(e.section)||0)+1));
const totalCount = id => descendants(id).reduce((a,s)=>a+(edgeCount.get(s)||0),0);

/* ---------- state ---------- */
const state = { sec:'*', kinds:new Set(KINDS.map(k=>k[0]).filter(k=>k!=='ruling')), sel:null, labels:true, dir:'all' };

/* ---------- table of contents ---------- */
const toc = document.getElementById('toc');
function renderToc(){
  toc.innerHTML='';
  const all = document.createElement('button');
  all.className='sec'; all.dataset.id='*';
  all.innerHTML = `<span class="t">ทุกประเด็น</span><span class="n">${TH(D.edges.length)}</span>`;
  toc.appendChild(all);
  D.categories.forEach(cat => {
    const box=document.createElement('div'); box.className='cat';
    const h=document.createElement('button'); h.className='cat-h'; h.setAttribute('aria-expanded','true');
    h.innerHTML=`<span class="chev">▼</span><span>${cat.title}</span>`;
    h.onclick=()=>{box.classList.toggle('closed'); h.setAttribute('aria-expanded', !box.classList.contains('closed'));};
    const items=document.createElement('div'); items.className='items';
    cat.ids.forEach(id => {
      const add=(sid,child)=>{
        const s=secs.get(sid); if(!s) return;
        const b=document.createElement('button'); b.className='sec'+(child?' child':''); b.dataset.id=sid;
        const tg=outcomeOwn(sid).tags;
        b.innerHTML=`<span class="tt"><span class="t">${s.title}</span>${tagHTML(tg)}</span><span class="n">${TH(totalCount(sid))}</span>`;
        items.appendChild(b);
        (children.get(sid)||[]).forEach(c=>add(c,true));
      };
      add(id,false);
    });
    box.append(h,items); toc.appendChild(box);
  });
  toc.querySelectorAll('.sec').forEach(b => b.onclick = () => go(b.dataset.id));
}
document.getElementById('secq').addEventListener('input', e => {
  const q = AR(e.target.value.trim()).toLowerCase();
  toc.querySelectorAll('.sec').forEach(b => {
    const t = AR(b.querySelector('.t').textContent).toLowerCase();
    b.classList.toggle('hidden', q && !t.includes(q));
  });
  if(q) toc.querySelectorAll('.cat').forEach(c=>c.classList.remove('closed'));
});

/* ---------- kind chips + legend ---------- */
/* "เปิดทั้งหมด / ปิดทั้งหมด" for a row of toggle chips, when the row is long enough to need it */
function allToggle(el, getSet, keys, refresh){
  if(keys.length<2) return;
  const box=document.createElement('span'); box.className='allbtns'; box.setAttribute('role','group'); box.setAttribute('aria-label','เลือกทั้งหมด');
  box.innerHTML='<button type="button" data-all="1">เปิดทั้งหมด</button><button type="button" data-all="0">ปิดทั้งหมด</button>';
  const sync=()=>{ const set=getSet(); box.children[0].disabled=keys.every(k=>set.has(k)); box.children[1].disabled=!keys.some(k=>set.has(k)); };
  box.querySelectorAll('button').forEach(b=>b.onclick=()=>{ const set=getSet(), on=b.dataset.all==='1';
    keys.forEach(k=>on?set.add(k):set.delete(k));
    el.querySelectorAll('.chip[data-k]').forEach(c=>c.setAttribute('aria-pressed', set.has(c.dataset.k)));
    sync(); refresh(); });
  el.addEventListener('click', sync);   // chips toggled one by one: their own handler has already run (bubbling)
  el.appendChild(box); sync();
}
const kindsEl=document.getElementById('kinds');
KINDS.forEach(([k,l])=>{
  const b=document.createElement('button'); b.className='chip'; b.dataset.k=k;
  b.setAttribute('aria-pressed', state.kinds.has(k));
  b.innerHTML=`<span class="sw" style="background:var(--k-${k})"></span>${l}`;
  b.onclick=()=>{ state.kinds.has(k)?state.kinds.delete(k):state.kinds.add(k); b.setAttribute('aria-pressed',state.kinds.has(k)); draw(); };
  kindsEl.appendChild(b);
});
allToggle(kindsEl, ()=>state.kinds, KINDS.map(k=>k[0]), ()=>draw());
document.getElementById('legend').innerHTML = NODE_TYPES.map(([t,l]) =>
  t==='witness' ? `<span><i style="border:2px solid var(--n-witness);background:var(--surface)"></i>${l}</span>`
  : t==='org' ? `<span><i style="border-radius:2px;background:var(--n-org)"></i>${l}</span>`
  : `<span><i style="background:var(--n-${t})"></i>${l}</span>`).join('');
document.getElementById('labels').onchange = e => { state.labels=e.target.checked; gLabels.style('display', state.labels?null:'none'); };

/* ---------- graph ---------- */
const svg=d3.select('#g'); const root=svg.append('g');
const defs=svg.append('defs');
KINDS.forEach(([k])=>defs.append('marker').attr('id','m-'+k).attr('viewBox','0 -4 8 8').attr('refX',8).attr('refY',0)
  .attr('markerWidth',7).attr('markerHeight',7).attr('orient','auto').append('path').attr('d','M0,-4L8,0L0,4').attr('fill',`var(--k-${k})`));
const gLinks=root.append('g'), gNodes=root.append('g'), gLabels=root.append('g');
const zoom=d3.zoom().scaleExtent([0.15,6]).on('zoom',e=>root.attr('transform',e.transform));
svg.call(zoom).on('dblclick.zoom',null);
document.getElementById('zin').onclick=()=>state.mode==='time' ? tsvg.transition().call(tz.scaleBy,1.6) : svg.transition().call(zoom.scaleBy,1.4);
document.getElementById('zout').onclick=()=>state.mode==='time' ? tsvg.transition().call(tz.scaleBy,1/1.6) : svg.transition().call(zoom.scaleBy,1/1.4);
document.getElementById('zfit').onclick=()=>state.mode==='time' ? tFitEvents(tFiltered().filter(e=>!state.sel||e.who.includes(state.sel)),true) : fit(true);
/* full screen: layout class + browser full screen on the whole page (so the PDF viewer can still open on top) */
const appEl=document.querySelector('.app'), zfull=document.getElementById('zfull');
function setFull(on){
  appEl.classList.toggle('gfull', on);
  zfull.setAttribute('aria-pressed', on);
  zfull.textContent = on ? '✕ ออกจากเต็มจอ' : '⛶ เต็มจอ';
  zfull.title = on ? 'ออกจากโหมดเต็มจอ (Esc)' : 'ขยายกราฟเต็มจอ (กด Esc เพื่อออก)';
  requestAnimationFrame(()=>requestAnimationFrame(()=>fit(true)));
}
zfull.onclick=()=>{
  const on=!appEl.classList.contains('gfull');
  setFull(on);
  const de=document.documentElement;
  try{
    if(on && de.requestFullscreen && !document.fullscreenElement) de.requestFullscreen().catch(()=>{});
    if(!on && document.fullscreenElement) document.exitFullscreen().catch(()=>{});
  }catch(_){}
};
// leaving browser full screen (Esc / F11) also leaves the full-screen layout
document.addEventListener('fullscreenchange',()=>{ if(!document.fullscreenElement && appEl.classList.contains('gfull')) setFull(false); });
// without the browser API (e.g. in a frame), Esc still leaves the layout when no PDF page is open
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && appEl.classList.contains('gfull') && document.getElementById('viewer').hidden && !document.fullscreenElement) setFull(false); }, true);  // capture: decide before Esc closes the PDF viewer
let sim=null, curNodes=[], curLinks=[];

function filteredEdges(){
  const ids = state.sec==='*' ? null : new Set(descendants(state.sec));
  return D.edges.filter(e => (!ids || ids.has(e.section)) && state.kinds.has(e.kind));
}
const PRI=['ruling','finding','action','accusation','testimony','defense'];
function draw(){
  if(state.mode==='money') return drawMoney();
  if(state.mode==='time') return drawTime();
  document.getElementById('empty').textContent='ไม่มีความเชื่อมโยงในตัวกรองนี้';
  const E=filteredEdges();
  renderPeople(E);
  const pairs=new Map(), deg=new Map(), selfIds=new Set();
  E.forEach(e=>{
    if(e.from===e.to){ selfIds.add(e.from); deg.set(e.from,(deg.get(e.from)||0)+1); return; }
    const key=e.from+'\u0001'+e.to;
    if(!pairs.has(key)) pairs.set(key,{source:e.from,target:e.to,items:[]});
    pairs.get(key).items.push(e);
    deg.set(e.from,(deg.get(e.from)||0)+1); deg.set(e.to,(deg.get(e.to)||0)+1);
  });
  const old=new Map(curNodes.map(n=>[n.id,n]));
  curNodes=[...deg.keys()].map(id=>{const o=old.get(id); const e=ent.get(id);
    return Object.assign(o||{x:(Math.random()-.5)*300,y:(Math.random()-.5)*300},{id,deg:deg.get(id),self:selfIds.has(id),type:e.type,label:e.label,num:e.num});});
  curLinks=[...pairs.values()].map(p=>{p.kind=PRI.find(k=>p.items.some(i=>i.kind===k)); return p;});
  document.getElementById('empty').hidden = curNodes.length>0;

  const big = curNodes.length>350;
  const r = d => Math.min(4+Math.sqrt(d.deg)*2.2, 22);
  const link=gLinks.selectAll('path').data(curLinks,d=>d.source.id?d.source.id+'>'+d.target.id:d.source+'>'+d.target);
  link.exit().remove();
  const linkE=link.enter().append('path').attr('class','link').on('click',(ev,d)=>{ev.stopPropagation(); showPair(d);});
  linkE.append('title');
  const linkAll=linkE.merge(link)
    .attr('stroke',d=>`var(--k-${d.kind})`).attr('stroke-opacity',big?.35:.6)
    .attr('stroke-width',d=>Math.min(1+Math.log2(d.items.length)*1.2,5))
    .attr('marker-end',d=>`url(#m-${d.kind})`);
  linkAll.select('title').text(d=>`${d.items.length} รายการ`);

  const node=gNodes.selectAll('g.node').data(curNodes,d=>d.id);
  node.exit().remove();
  const nodeE=node.enter().append('g').attr('class',d=>'node '+d.type)
    .on('click',(ev,d)=>{ev.stopPropagation(); select(d.id);})
    .call(d3.drag().on('start',(ev,d)=>{if(!ev.active)sim.alphaTarget(.2).restart(); d.fx=d.x; d.fy=d.y;})
      .on('drag',(ev,d)=>{d.fx=ev.x; d.fy=ev.y;}).on('end',(ev,d)=>{if(!ev.active)sim.alphaTarget(0); d.fx=null; d.fy=null;}));
  nodeE.each(function(d){ const g=d3.select(this);
    if(d.type==='org'||d.type==='group') g.append('rect'); else g.append('circle');
    g.append('title'); });
  const nodeAll=nodeE.merge(node).classed('self',d=>d.self);
  nodeAll.select('circle').attr('r',r).attr('fill',d=>`var(--n-${d.type})`).style('stroke',d=>d.type==='witness'?`var(--n-witness)`:null);
  nodeAll.select('rect').attr('width',d=>r(d)*2).attr('height',d=>r(d)*2).attr('x',d=>-r(d)).attr('y',d=>-r(d)).attr('rx',2).attr('fill',d=>`var(--n-${d.type})`);
  nodeAll.select('title').text(d=>nameOf(d.id));

  const showLabel = d => !big || d.deg>=6 || d.type==='org';
  const lab=gLabels.selectAll('g').data(curNodes.filter(showLabel),d=>d.id);
  lab.exit().remove();
  const labE=lab.enter().append('g').attr('class','node');
  labE.append('text').attr('dy','0.32em');
  labE.merge(lab).select('text').attr('x',d=>r(d)+4).text(d=>shortName(d.id));
  gLabels.style('display', state.labels?null:'none');

  if(sim) sim.stop();
  sim=d3.forceSimulation(curNodes)
    .force('link',d3.forceLink(curLinks).id(d=>d.id).distance(big?45:95).strength(.35))
    .force('charge',d3.forceManyBody().strength(big?-45:-320))
    .force('collide',d3.forceCollide(d=>r(d)+3))
    .force('x',d3.forceX().strength(.04)).force('y',d3.forceY().strength(.04))
    .on('tick',()=>{
      linkAll.attr('d',d=>{const dx=d.target.x-d.source.x, dy=d.target.y-d.source.y, L=Math.hypot(dx,dy)||1, tr=r(d.target)+2;
        return `M${d.source.x},${d.source.y}L${d.target.x-dx/L*tr},${d.target.y-dy/L*tr}`;});
      gNodes.selectAll('g.node').attr('transform',d=>`translate(${d.x},${d.y})`);
      gLabels.selectAll('g').attr('transform',d=>`translate(${d.x},${d.y})`);
    });
  sim.on('end',()=>fit(true));
  sim.alpha(1).restart();
  setTimeout(()=>fit(false), big?1400:700);
  highlight();
}
function fit(anim){
  if(state.mode==='time'){ if(tsvg.node().clientWidth){ tLayout(); tRender(); } return; }
  if(!curNodes.length) return;
  const box=svg.node().getBoundingClientRect();
  const xs=curNodes.map(n=>n.x), ys=curNodes.map(n=>n.y);
  const x0=Math.min(...xs)-40,x1=Math.max(...xs)+120,y0=Math.min(...ys)-40,y1=Math.max(...ys)+40;
  const k=Math.min(2.2, Math.min(box.width/(x1-x0), box.height/(y1-y0)));
  const t=d3.zoomIdentity.translate(box.width/2-k*(x0+x1)/2, box.height/2-k*(y0+y1)/2).scale(k);
  (anim?svg.transition().duration(500):svg).call(zoom.transform,t);
}
svg.on('click',()=>{ state.sel=null; highlight(); markPeople(); showSection(); });

function highlight(){
  const s=state.sel;
  if(!s || !curNodes.some(n=>n.id===s)){ gNodes.selectAll('g.node').classed('dim',false).classed('sel',false); gLinks.selectAll('path,text').classed('dim',false); gLabels.selectAll('g').classed('dim',false); return; }
  const nb=new Set([s]); curLinks.forEach(l=>{ if(l.source.id===s) nb.add(l.target.id); if(l.target.id===s) nb.add(l.source.id); });
  gNodes.selectAll('g.node').classed('dim',d=>!nb.has(d.id)).classed('sel',d=>d.id===s);
  gLabels.selectAll('g').classed('dim',d=>!nb.has(d.id));
  gLinks.selectAll('path,text').classed('dim',l=>l.source.id!==s && l.target.id!==s);
}

/* ---------- people list ---------- */
const pplEl=document.getElementById('ppl'), pplq=document.getElementById('pplq'), ppltype=document.getElementById('ppltype'), pplsort=document.getElementById('pplsort');
let pplRows=[];
function renderPeople(E){
  const c=new Map(); const get=id=>{ if(!c.has(id)) c.set(id,{id,out:0,inn:0,self:0}); return c.get(id); };
  E.forEach(e=>{ if(e.from===e.to){ get(e.from).self++; return; } get(e.from).out++; get(e.to).inn++; });
  pplRows=[...c.values()];
  listPeople();
}
function typeKey(id){ if(id.startsWith('R')) return 'R'; const t=(ent.get(id)||{}).type; return t==='group'?'org':t; }
function listPeople(){
  const q=AR(pplq.value.trim()).toLowerCase(), t=ppltype.value, srt=pplsort.value;
  const rows=pplRows.filter(r=>{
    if(t && typeKey(r.id)!==t) return false;
    if(!q) return true;
    const e=ent.get(r.id)||{}; return AR(`${e.label||r.id} ${e.num??''} ${roleOf(r.id)}`).toLowerCase().includes(q);
  });
  const num=id=>(ent.get(id)||{}).num ?? 1e9;
  rows.sort(srt==='out'?(a,b)=>b.out-a.out||b.inn-a.inn : srt==='in'?(a,b)=>b.inn-a.inn||b.out-a.out
    : srt==='num'?(a,b)=>num(a.id)-num(b.id)||a.id.localeCompare(b.id) : (a,b)=>(b.out+b.inn+b.self)-(a.out+a.inn+a.self));
  document.getElementById('pplnote').textContent = `${TH(rows.length)} คน${state.sec==='*'?'':' ในประเด็นที่เลือก'} · กดปุ่มเพื่อดูว่าพูดถึงใคร หรือใครพูดถึง`;
  const shown=rows.slice(0,300);
  pplEl.innerHTML = shown.map(r=>`<div class="prow${r.id===state.sel?' on':''}" data-id="${esc(r.id)}">
      <button class="pname" data-pick="${esc(r.id)}">${esc(shortName(r.id))}<small>${esc(roleOf(r.id))}</small></button>
      <div class="pdir"><button data-pick="${esc(r.id)}" data-d="out" ${r.out?'':'disabled'}>พูดถึง ${TH(r.out)}</button><button data-pick="${esc(r.id)}" data-d="in" ${r.inn?'':'disabled'}>ถูกพูดถึง ${TH(r.inn)}</button></div>
    </div>`).join('') + (rows.length>shown.length?`<div class="hint" style="padding:8px">แสดง ${TH(shown.length)} จาก ${TH(rows.length)} คน · พิมพ์ค้นหาเพื่อหาคนอื่น</div>`:'')
    + (!rows.length?'<div class="hint" style="padding:8px">ไม่พบบุคคลในตัวกรองนี้</div>':'');
  pplEl.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.pick; select(id, b.dataset.d||'all');
    const n=curNodes.find(n=>n.id===id);
    if(n){ const box=svg.node().getBoundingClientRect(); svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity.translate(box.width/2-1.4*n.x, box.height/2-1.4*n.y).scale(1.4)); }
  });
}
function markPeople(){ pplEl.querySelectorAll('.prow').forEach(r=>r.classList.toggle('on', r.dataset.id===state.sel)); }
pplq.addEventListener('input', listPeople); ppltype.onchange=listPeople; pplsort.onchange=listPeople;
const tabs=[['tab-sec','panel-sec'],['tab-ppl','panel-ppl']];
tabs.forEach(([t,p])=>document.getElementById(t).onclick=()=>tabs.forEach(([t2,p2])=>{
  document.getElementById(t2).setAttribute('aria-selected', t2===t); document.getElementById(p2).hidden = p2!==p; }));

/* ---------- node search ---------- */
document.getElementById('nodeq').addEventListener('keydown', e=>{
  if(e.key!=='Enter') return;
  const q=AR(e.target.value.trim()); if(!q) return;
  let id = /^\d+$/.test(q) ? 'R'+q : null;
  if(!id || !ent.has(id)){ const hit=[...ent.values()].find(x=>AR(x.label).includes(q)); id=hit&&hit.id; }
  if(!id){ e.target.setCustomValidity('ไม่พบชื่อนี้'); e.target.reportValidity(); setTimeout(()=>e.target.setCustomValidity(''),1500); return; }
  if(state.mode!=='time' && !curNodes.some(n=>n.id===id)) go('*');
  select(id);
  const n=curNodes.find(n=>n.id===id);
  if(n){ const box=svg.node().getBoundingClientRect(); svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity.translate(box.width/2-1.6*n.x, box.height/2-1.6*n.y).scale(1.6)); }
});

/* ---------- money flow: who transferred how much to whom ---------- */
const MONEY = D.money||[]; MONEY.forEach((m,i)=>m._i=i);
const MV = { ev:['มีหลักฐานอันควรเชื่อ','var(--k-action)','mev'], nf:['ข้อเท็จจริงรับฟังไม่ได้','var(--faint)','nf'] };
state.mode='rel'; state.mv=new Set(['ev','nf']);
const fmt = n => TH(Math.round(n).toLocaleString('en-US'));
const baht = n => n==null ? 'ไม่ระบุจำนวน' : fmt(n)+' บาท';
const bahtShort = n => n==null ? 'ไม่ระบุ' : Math.abs(n)>=1e6 ? TH((n/1e6).toFixed(2).replace(/\.?0+$/,''))+' ล้าน' : fmt(n);
const sumAmt = a => a.reduce((s,m)=>s+(m.amt||0),0);
const unkN = a => a.filter(m=>m.amt==null).length;
const sumLine = a => `${baht(sumAmt(a))}${unkN(a)?` + ไม่ระบุยอด ${TH(unkN(a))} รายการ`:''}`;
const pairKey = m => m.from+'\u0001'+m.to;
// scales are fixed over the whole document so widths stay comparable between sections
const MAXPAIR = Math.max(1, ...[...MONEY.reduce((s,m)=>s.set(pairKey(m),(s.get(pairKey(m))||0)+(m.amt||0)),new Map()).values()]);
const MAXFLOW = Math.max(1, ...[...MONEY.reduce((s,m)=>{ [m.from,m.to].forEach(id=>s.set(id,(s.get(id)||0)+(m.amt||0))); return s; },new Map()).values()]);
const moneyW = p => p.amt>0 ? 1.5+Math.sqrt(p.amt/MAXPAIR)*16 : 1.5;
const mR = d => 5+Math.sqrt((d.flow||0)/MAXFLOW)*18;
function moneyFiltered(){
  const ids = state.sec==='*' ? null : new Set(descendants(state.sec));
  return MONEY.filter(m => (!ids||ids.has(m.section)) && state.mv.has(m.v));
}
const openMoney = m => openViewer(m.hl, m.text, `${shortName(m.from)} → ${shortName(m.to)} · ${baht(m.amt)} · หน้า ${TH(m.page)}`);

const mkindsEl=document.getElementById('mkinds');
Object.entries(MV).forEach(([k,[l,c]])=>{
  const b=document.createElement('button'); b.className='chip'; b.setAttribute('aria-pressed','true'); b.dataset.k=k;
  b.innerHTML=`<span class="sw" style="background:${c}"></span>${l}`;
  b.onclick=()=>{ state.mv.has(k)?state.mv.delete(k):state.mv.add(k); b.setAttribute('aria-pressed',state.mv.has(k)); draw(); if(state.sel) selectMoney(state.sel); else showSection(); };
  mkindsEl.appendChild(b);
});
allToggle(mkindsEl, ()=>state.mv, Object.keys(MV), ()=>{ draw(); if(state.sel) selectMoney(state.sel); else showSection(); });
mkindsEl.insertAdjacentHTML('beforeend','<span class="hint" style="font-size:12px">เส้นหนาและหัวลูกศรใหญ่ตามยอดเงิน · เส้นประ = ไม่ระบุยอด</span>');

function mGeom(d){
  const S=d.source, T=d.target, dx=T.x-S.x, dy=T.y-S.y, L=Math.hypot(dx,dy)||1;
  const k=d.rev?0.22:0.08, cx=(S.x+T.x)/2-dy*k, cy=(S.y+T.y)/2+dx*k;
  const unit=(ax,ay,bx,by)=>{ const l=Math.hypot(bx-ax,by-ay)||1; return [(bx-ax)/l,(by-ay)/l]; };
  const [ux,uy]=unit(cx,cy,T.x,T.y), [vx,vy]=unit(cx,cy,S.x,S.y);
  const tx=T.x-ux*(mR(T)+2), ty=T.y-uy*(mR(T)+2);
  const a=6+d.w*1.4, hw=a*0.55, bx=tx-ux*a, by=ty-uy*a;
  const sx=S.x-vx*(mR(S)+1), sy=S.y-vy*(mR(S)+1);
  return { line:`M${sx},${sy}Q${cx},${cy} ${bx},${by}`,
    head:`M${tx},${ty}L${bx-uy*hw},${by+ux*hw}L${bx+uy*hw},${by-ux*hw}Z`,
    mx:.25*S.x+.5*cx+.25*T.x, my:.25*S.y+.5*cy+.25*T.y };
}
function drawMoney(){
  renderPeople(filteredEdges());
  const M=moneyFiltered(), pairs=new Map(), flow=new Map();
  M.forEach(m=>{ const k=pairKey(m);
    if(!pairs.has(k)) pairs.set(k,{source:m.from,target:m.to,items:[],amt:0,unk:0});
    const p=pairs.get(k); p.items.push(m); if(m.amt==null) p.unk++; else p.amt+=m.amt;
    [m.from,m.to].forEach(id=>flow.set(id,(flow.get(id)||0)+(m.amt||0))); });
  const old=new Map(curNodes.map(n=>[n.id,n]));
  curNodes=[...flow.keys()].map(id=>{ const o=old.get(id), e=ent.get(id)||{};
    return Object.assign(o||{x:(Math.random()-.5)*300,y:(Math.random()-.5)*300},{id,flow:flow.get(id),type:e.type||'person',label:e.label,num:e.num}); });
  curLinks=[...pairs.values()];
  curLinks.forEach(p=>{ p.v=p.items.some(i=>i.v==='ev')?'ev':'nf'; p.rev=pairs.has(p.target+'\u0001'+p.source); p.w=moneyW(p); });
  const empty=document.getElementById('empty'); empty.textContent='ไม่มีรายการโอนเงินในประเด็นหรือตัวกรองนี้'; empty.hidden=curNodes.length>0;

  const link=gLinks.selectAll('g.mlink').data(curLinks,d=>(d.source.id||d.source)+'>'+(d.target.id||d.target));
  link.exit().remove();
  const le=link.enter().append('g').attr('class','mlink').on('click',(ev,d)=>{ev.stopPropagation(); showMoneyPair(d);});
  le.append('path').attr('class','mline'); le.append('path').attr('class','mhead'); le.append('text').attr('class','mamt').attr('dy','-0.35em'); le.append('title');
  const la=le.merge(link);
  la.select('.mline').attr('stroke',d=>MV[d.v][1]).attr('stroke-width',d=>d.w).attr('stroke-opacity',.72).attr('stroke-dasharray',d=>d.amt?null:'5 4');
  la.select('.mhead').style('fill',d=>MV[d.v][1]);
  la.select('.mamt').text(d=>d.amt?bahtShort(d.amt)+(d.unk?' +?':''):'ไม่ระบุยอด');
  la.select('title').text(d=>`${nameOf(d.source.id||d.source)} → ${nameOf(d.target.id||d.target)} · ${baht(d.amt||null)}${d.items.length>1?` (${TH(d.items.length)} รายการ)`:''}`);

  const node=gNodes.selectAll('g.node').data(curNodes,d=>d.id);
  node.exit().remove();
  const nodeE=node.enter().append('g').attr('class',d=>'node '+d.type)
    .on('click',(ev,d)=>{ev.stopPropagation(); selectMoney(d.id);})
    .call(d3.drag().on('start',(ev,d)=>{if(!ev.active)sim.alphaTarget(.2).restart(); d.fx=d.x; d.fy=d.y;})
      .on('drag',(ev,d)=>{d.fx=ev.x; d.fy=ev.y;}).on('end',(ev,d)=>{if(!ev.active)sim.alphaTarget(0); d.fx=null; d.fy=null;}));
  nodeE.each(function(d){ const g=d3.select(this); if(d.type==='org'||d.type==='group') g.append('rect'); else g.append('circle'); g.append('title'); });
  const nodeAll=nodeE.merge(node);
  nodeAll.select('circle').attr('r',mR).attr('fill',d=>`var(--n-${d.type})`).style('stroke',d=>d.type==='witness'?'var(--n-witness)':null);
  nodeAll.select('rect').attr('width',d=>mR(d)*2).attr('height',d=>mR(d)*2).attr('x',d=>-mR(d)).attr('y',d=>-mR(d)).attr('rx',2).attr('fill',d=>`var(--n-${d.type})`);
  nodeAll.select('title').text(d=>`${nameOf(d.id)} · เงินผ่าน ${baht(d.flow)}`);

  const lab=gLabels.selectAll('g').data(curNodes,d=>d.id);
  lab.exit().remove();
  const labE=lab.enter().append('g').attr('class','node'); labE.append('text').attr('dy','0.32em');
  labE.merge(lab).select('text').attr('x',d=>mR(d)+4).text(d=>shortName(d.id));
  gLabels.style('display', state.labels?null:'none');

  if(sim) sim.stop();
  sim=d3.forceSimulation(curNodes)
    .force('link',d3.forceLink(curLinks).id(d=>d.id).distance(120).strength(.5))
    .force('charge',d3.forceManyBody().strength(-340))
    .force('collide',d3.forceCollide(d=>mR(d)+8))
    .force('x',d3.forceX().strength(.05)).force('y',d3.forceY().strength(.05))
    .on('tick',()=>{
      la.each(function(d){ const g=mGeom(d), s=d3.select(this);
        s.select('.mline').attr('d',g.line); s.select('.mhead').attr('d',g.head); s.select('.mamt').attr('x',g.mx).attr('y',g.my); });
      gNodes.selectAll('g.node').attr('transform',d=>`translate(${d.x},${d.y})`);
      gLabels.selectAll('g').attr('transform',d=>`translate(${d.x},${d.y})`);
    });
  sim.on('end',()=>fit(true));
  sim.alpha(1).restart();
  setTimeout(()=>fit(false),700);
  highlight();
}
function mHTML(m, pair){
  return `<div class="stmt" style="border-color:${MV[m.v][1]}">
    <div class="who"><b class="amt" style="color:var(--fg)">${baht(m.amt)}</b> · ${esc(m.date||'')} <span class="otag ${MV[m.v][2]}">${MV[m.v][0]}</span></div>
    ${pair?`<div class="who"><button data-node="${esc(m.from)}">${esc(shortName(m.from))}</button> → <button data-node="${esc(m.to)}">${esc(shortName(m.to))}</button></div>`:''}
    <blockquote class="txt" data-m="${m._i}" title="เปิดหน้า ${TH(m.page)} ในเอกสารต้นฉบับ" tabindex="0">“${esc(m.text)}”</blockquote>
    ${m.note?`<div class="src">หมายเหตุผู้จัดทำ: ${esc(m.note)}</div>`:''}
    <div class="src"><button class="pg" data-m="${m._i}" title="เปิดในเอกสารต้นฉบับ">หน้า ${TH(m.page)}</button> · <button data-sec="${esc(m.section)}">${esc(secTitle(m.section))}</button></div></div>`;
}
function mGroups(arr, key, word){
  const g=new Map(); arr.forEach(m=>{ const k=key(m); if(!g.has(k)) g.set(k,[]); g.get(k).push(m); });
  return [...g.entries()].sort((a,b)=>sumAmt(b[1])-sumAmt(a[1])).map(([p,items])=>`<div class="pgrp">
    <div class="group-h"><b>${word} <button data-node="${esc(p)}">${esc(shortName(p))}</button></b><span>${sumLine(items)}</span></div>
    ${items.map(m=>mHTML(m,false)).join('')}</div>`).join('');
}
function selectMoney(id){
  state.sel=id; highlight(); markPeople();
  const M=moneyFiltered(), out=M.filter(m=>m.from===id), inn=M.filter(m=>m.to===id);
  const all=MONEY.filter(m=>m.from===id||m.to===id), net=sumAmt(inn)-sumAmt(out), rr=RESP.get(id);
  dlabel.textContent='เส้นทางการเงิน · บุคคล';
  det.innerHTML=`<div><h3>${rr&&rr.hl?`<button class="nameBtn" data-person="${esc(id)}" title="เปิดรายชื่อในเอกสาร หน้า ${TH(rr.page)}">${esc(nameOf(id))}</button>`:esc(nameOf(id))}</h3>
      <div class="role">${esc(roleOf(id))}</div></div>
    <div class="stats">
      <div><b>${bahtShort(sumAmt(out))}</b><span>โอนออก (บาท) · ${TH(out.length)} รายการ</span></div>
      <div><b>${bahtShort(sumAmt(inn))}</b><span>ได้รับ (บาท) · ${TH(inn.length)} รายการ</span></div>
      <div><b class="${net<0?'neg':''}">${net>0?'+':''}${bahtShort(net)}</b><span>สุทธิ (ได้รับ − โอนออก)</span></div></div>
    ${unkN(out)+unkN(inn)?`<div class="hint">มี ${TH(unkN(out)+unkN(inn))} รายการที่เอกสารไม่ระบุยอดเงิน จึงไม่ได้รวมในยอดข้างบน</div>`:''}
    ${all.length>out.length+inn.length?`<div class="hint">แสดงเฉพาะประเด็นและตัวกรองที่เลือก · ในเอกสารทั้งหมดมี ${TH(all.length)} รายการ <button class="more" id="allsec">ดูทุกประเด็น</button></div>`:''}
    ${!out.length&&!inn.length?'<div class="hint">ไม่พบรายการโอนเงินของบุคคลนี้ในตัวกรองนี้</div>':''}
    ${out.length?`<div class="group-h"><b>โอนออก</b><span>${sumLine(out)}</span></div>${mGroups(out,m=>m.to,'ให้')}`:''}
    ${inn.length?`<div class="group-h"><b>ได้รับ</b><span>${sumLine(inn)}</span></div>${mGroups(inn,m=>m.from,'จาก')}`:''}`;
  const a=document.getElementById('allsec');
  if(a) a.onclick=()=>{ Object.keys(MV).forEach(k=>state.mv.add(k)); mkindsEl.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed','true')); go('*'); selectMoney(id); };
  bindDetail(); det.parentElement.scrollTop=0;
}
function showMoneyPair(p){
  const a=p.source.id, b=p.target.id, back=curLinks.find(l=>l.source.id===b&&l.target.id===a);
  const items=[...p.items, ...(back?back.items:[])];
  dlabel.textContent='เส้นทางการเงิน · การโอน';
  det.innerHTML=`<div><h3>${esc(shortName(a))} → ${esc(shortName(b))}</h3>
      <div class="role">${sumLine(p.items)}${back?` · โอนกลับ ${sumLine(back.items)}`:''} · คลิกข้อความเพื่อเปิดหน้าในเอกสาร</div></div>
    ${items.map(m=>mHTML(m,true)).join('')}`;
  bindDetail(); det.parentElement.scrollTop=0;
  if(items.length) openMoney(items[0]);
}
function showMoneySection(){
  const M=moneyFiltered(), ev=M.filter(m=>m.v==='ev'), nf=M.filter(m=>m.v==='nf');
  const people=new Set(M.flatMap(m=>[m.from,m.to]));
  const tally=key=>{ const s=new Map(); M.forEach(m=>s.set(key(m),(s.get(key(m))||0)+(m.amt||0))); return [...s.entries()].sort((x,y)=>y[1]-x[1]).slice(0,8); };
  const rows=arr=>arr.map(([p,v])=>`<div class="mrow"><button data-node="${esc(p)}">${esc(shortName(p))}</button><span>${baht(v)}</span></div>`).join('');
  dlabel.textContent='เส้นทางการเงิน · ภาพรวม';
  det.innerHTML=`<div class="stats"><div><b>${bahtShort(sumAmt(M))}</b><span>ยอดโอนรวม (บาท)</span></div><div><b>${TH(M.length)}</b><span>รายการโอน</span></div><div><b>${TH(people.size)}</b><span>บุคคล/บัญชี</span></div></div>
    <div class="outcome" style="border-left-color:var(--k-action)"><h4>ผลวินิจฉัยของรายการโอน</h4>
      <div class="item"><span class="otag mev">${MV.ev[0]}</span> ${TH(ev.length)} รายการ · ${baht(sumAmt(ev))}</div>
      <div class="item"><span class="otag nf">${MV.nf[0]}</span> ${TH(nf.length)} รายการ · ${baht(sumAmt(nf))}</div>
      <div class="note">“รับฟังไม่ได้” คือ กกต. เห็นว่าการโอนนั้นไม่เกี่ยวกับการเลือก สว. เช่น เป็นค่าจ้าง ค่าสินค้า หรือเงินในครอบครัว</div></div>
    ${M.length?`<div class="group-h"><b>โอนออกมากที่สุด</b><span>ในตัวกรองนี้</span></div>${rows(tally(m=>m.from))}
    <div class="group-h"><b>ได้รับมากที่สุด</b><span>ในตัวกรองนี้</span></div>${rows(tally(m=>m.to))}`:'<div class="hint">ไม่มีรายการโอนเงินในประเด็นนี้ · เลือก “ทุกประเด็น” เพื่อดูทั้งหมด</div>'}
    <div class="hint">ยอดเงินคัดจากข้อความในคำวินิจฉัย บางรายการเป็นยอดที่อนุมานจากข้อความ (ดูหมายเหตุในแต่ละรายการ) · คลิกเส้นเพื่อดูข้อความในเอกสาร คลิกจุดเพื่อดูยอดโอนออก/ได้รับ</div>`;
  bindDetail();
}

/* ---------- timeline: what happened when, one swimlane per group of people ---------- */
const TL = D.timeline || {lanes:[], events:[], milestones:[]};
const day = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const isoOf = t => `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
const EV = TL.events; EV.forEach((e,i)=>{ e._i=i; e.t=day(e.d); if(e.d2) e.t2=day(e.d2); e.pts=(e.ds||[e.d]).map(day); });

// the people of the clicked event (or just the selected person) and the lane each of them sits in
const PL = TL.pl || {};

// one thread per person: every dot of that person's events in their own lane, left to right
function tKin(e){
  const P=tKinPeople(e), E=tFiltered(), th=[];
  P.forEach(p=>{ const pts=[];
    E.forEach(x=>{ if(x.who.includes(p)) (tPos.get(x._i)||[]).forEach(q=>{ if(q[3]===PL[p]) pts.push(q); }); });
    if(pts.length>1) th.push({p, l:PL[p], pts:pts.sort((a,b)=>a[0]-b[0]||b[1]-a[1])}); });
  tG.kin.selectAll('path').data(th,d=>d.p).join('path').attr('class','tkin').style('stroke',d=>LANE_COL[d.l])
    .attr('d',d=>d3.line().curve(d3.curveBumpX)(d.pts));

    .classed('kin',isKin).classed('faint',d=>!!he && !s && d.e!==he && !isKin(d));

// names beside the clicked dots and the dots linked to them (only the people of that lane);

function tNames(he, kin){
  const L=[];
  if(he) tG.dots.selectAll('circle').each(d=>{
    if(d.e!==he && !(d.e.who.some(p=>kin.has(p)))) return;
    const ppl=d.e.who.filter(p=>PL[p]===d.l && (d.e===he || kin.has(p)));
    if(!ppl.length) return;
    const txt=ppl.slice(0,2).map(shortName).join(', ')+(ppl.length>2?` +${TH(ppl.length-2)}`:'');
    L.push({d, txt, hot:d.e===he, key:d.key, pr:d.e===he?-1:Math.abs(d.x-(tPos.get(he._i)||[[d.x]])[0][0])});
  });

  det.innerHTML=`<div><h3>${esc(evDate(e))}</h3><div class="role">ในเอกสารเขียนว่า “${esc(e.dt)}” · คลิกข้อความเพื่อเปิดหน้านั้นในเอกสาร</div></div>
    ${tItem(e,false)}
    ${mon.length?`<div class="group-h"><b>รายการโอนเงินในข้อความนี้</b><span>${sumLine(mon)}</span></div>${mon.map(m=>mHTML(m,true)).join('')}`:''}
    ${rel.length?`<div class="group-h"><b>ความเชื่อมโยงจากข้อความนี้</b><span>${TH(rel.length)} รายการ</span></div><div class="stmt" style="border-color:var(--line)">${moreList(rel,10,relRow)}</div>`:''}
    ${same.length?`<div class="group-h"><b>เหตุการณ์อื่นในวันเดียวกัน</b><span>${TH(same.length)} รายการ</span></div>${moreList(same,8,x=>tItem(x))}`:''}
    ${kinEv.length?`<div class="group-h"><b>บุคคลเดียวกันในวันอื่น</b><span>${TH(kinEv.length)} รายการ</span></div>
      <div class="hint">เส้นสีในแผนภาพเชื่อมจุดของแต่ละคนข้ามวัน · ${kinWho.slice(0,8).join(', ')}${kinWho.length>8?` และอีก ${TH(kinWho.length-8)} ราย`:''}</div>${moreList(kinEv,8,x=>tItem(x))}`:''}`;
  bindDetail(); det.parentElement.scrollTop=0;
}
function showBin(items){
  const arr=[...new Set(items)].sort((a,b)=>a.t-b.t);
  state.tev=null; tMark();
  dlabel.textContent='ลำดับเวลา · กลุ่มเหตุการณ์';
  det.innerHTML=`<div><h3>${esc(thDate(arr[0].t))}${+arr[0].t!==+arr[arr.length-1].t?` – ${esc(thDate(arr[arr.length-1].t))}`:''}</h3>
    <div class="role">${TH(arr.length)} เหตุการณ์ · ซูมเข้าเพื่อแยกเป็นรายวัน</div></div>${moreList(arr,25,x=>tItem(x))}`;
  bindDetail(); det.parentElement.scrollTop=0;
}
function showDay(ds){
  const t=day(ds), arr=tFiltered().filter(e=>e.pts.some(u=>+u===+t));
  if(arr.length) showBin(arr);
}
function selectTime(id, keepZoom){
  state.sel=id; state.tev=null; markPeople();
  const all=EV.filter(e=>e.who.includes(id)), F=tFiltered().filter(e=>e.who.includes(id)), rr=RESP.get(id);
  dlabel.textContent='ลำดับเวลา · บุคคล';
  const last=F.length?F[F.length-1]:null;
  det.innerHTML=`<div><h3>${rr&&rr.hl?`<button class="nameBtn" data-person="${esc(id)}" title="เปิดรายชื่อในเอกสาร หน้า ${TH(rr.page)}">${esc(nameOf(id))}</button>`:esc(nameOf(id))}</h3>
      <div class="role">${esc(roleOf(id))}</div></div>
    <div class="stats"><div><b>${TH(F.length)}</b><span>เหตุการณ์ที่ระบุวันที่</span></div>
      <div><b>${F.length?esc(thShort(F[0].t)):'–'}</b><span>ครั้งแรก</span></div>
      <div><b>${last?esc(thShort(last.t2||last.pts[last.pts.length-1])):'–'}</b><span>ครั้งล่าสุด</span></div></div>
    ${all.length>F.length?`<div class="hint">แสดงเฉพาะประเด็นและตัวกรองที่เลือก · ในเอกสารทั้งหมดมี ${TH(all.length)} เหตุการณ์ <button class="more" id="allsec">ดูทุกประเด็น</button></div>`:''}
    ${F.length?`<div class="group-h"><b>เรียงตามวันที่</b><span>${TH(F.length)} รายการ</span></div>${moreList(F,25,e=>tItem(e))}`:'<div class="hint">ไม่พบเหตุการณ์ที่ระบุวันที่ของบุคคลนี้ในตัวกรองนี้</div>'}`;
  bindDetail();
  const a=document.getElementById('allsec');
  if(a) a.onclick=()=>{ TKO.forEach(k=>state.tk.add(k)); tkindsEl.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed','true')); go('*'); selectTime(id); };
  det.parentElement.scrollTop=0;
  tMark();
  if(!keepZoom && F.length) tFitEvents(F, true);
}
function showTimeSection(){
  state.tev=null; tMark();
  const E=tFiltered();
  dlabel.textContent='ลำดับเวลา · ภาพรวม';
  const dayCount=d3.rollups(E.flatMap(e=>e.pts), v=>v.length, t=>+t).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const first=E.length?d3.min(E,e=>e.t):null, last=E.length?d3.max(E,e=>e.t2||e.pts[e.pts.length-1]):null;
  const ppl=new Set(E.flatMap(e=>e.who));
  det.innerHTML=`<div class="stats"><div><b>${TH(E.length)}</b><span>เหตุการณ์ที่ระบุวันที่</span></div>
      <div><b>${TH(new Set(E.flatMap(e=>e.pts.map(t=>+t))).size)}</b><span>วันที่ต่างกัน</span></div>
      <div><b>${TH(ppl.size)}</b><span>บุคคลที่เกี่ยวข้อง</span></div></div>
    ${E.length?`<div class="hint">ตั้งแต่ ${thDate(first)} ถึง ${thDate(last)}</div>`:'<div class="hint">ไม่มีเหตุการณ์ที่ระบุวันที่ในประเด็นหรือตัวกรองนี้ · เลือก “ทุกประเด็น” เพื่อดูทั้งหมด</div>'}
    <div class="outcome" style="border-left-color:var(--fg)"><h4>วันสำคัญ</h4>
      ${MILES.map((m,i)=>`<div class="trow"><button data-mile="${i}">${esc(m.label)}</button><span>${thDate(m.t)}</span></div>`).join('')}
      <div class="note">เส้นประแนวตั้งในแผนภาพ · คลิกเพื่อเลื่อนไปยังวันนั้นและเปิดข้อความในเอกสาร</div></div>
    ${dayCount.length?`<div class="group-h"><b>วันที่มีเหตุการณ์มากที่สุด</b><span>ในตัวกรองนี้</span></div>
      <div class="tday">${dayCount.map(([t,n])=>`<div class="trow"><button data-tday="${isoOf(new Date(t))}">${thDate(new Date(t))}</button><span>${TH(n)} เหตุการณ์</span></div>`).join('')}</div>`:''}
    <div class="hint">แต่ละจุดคือข้อความในคำวินิจฉัยที่ระบุวันที่ วางตามวันที่และกลุ่มของบุคคลที่เกี่ยวข้อง เหตุการณ์ที่เกี่ยวกับหลายกลุ่มจึงปรากฏในหลายช่อง · ชี้ที่จุดเพื่อดูเส้นเชื่อมข้ามช่อง · คลิกจุดเพื่ออ่านข้อความและดูเส้นสีที่ตามบุคคลเดียวกันไปยังวันอื่น · เลื่อนล้อเมาส์เพื่อซูมแกนเวลา ลากเพื่อเลื่อน</div>`;
  bindDetail();
}

const tkindsEl=document.getElementById('tkinds');
Object.entries(TK).forEach(([k,[l,c]])=>{
  if(!EV.some(e=>e.k===k)) return;
  const b=document.createElement('button'); b.className='chip'; b.setAttribute('aria-pressed','true');
  b.dataset.k=k;
  const dot=col=>`<span class="sw" style="background:${col};width:9px;height:9px;border-radius:50%"></span>`;
  b.innerHTML = k==='money' ? `<span style="display:inline-flex;gap:2px">${Object.values(MROLE).map(r=>dot(r[1])).join('')}</span>${l}` : `${dot(c)}${l}`;
  if(k==='money') b.title = Object.values(MROLE).map(r=>r[0]).join(' · ');
  b.onclick=()=>{ state.tk.has(k)?state.tk.delete(k):state.tk.add(k); b.setAttribute('aria-pressed',state.tk.has(k)); tRender(); if(state.sel) selectTime(state.sel,true); else showSection(); };
  tkindsEl.appendChild(b);
});
allToggle(tkindsEl, ()=>state.tk, TKO.filter(k=>EV.some(e=>e.k===k)), ()=>{ tRender(); if(state.sel) selectTime(state.sel,true); else showSection(); });
const trEl=document.getElementById('tranges');
trEl.insertAdjacentHTML('beforeend','<span class="hint" style="font-size:12px">ช่วงเวลา</span>');
PRESETS.forEach(([l,a,b])=>{ const x=document.createElement('button'); x.className='chip'; x.textContent=l;
  x.onclick=()=>a?tZoomTo(day(a),day(b),true):tZoomTo(tExtent[0],tExtent[1],true); trEl.appendChild(x); });
const timeLegend = Object.values(MROLE).map(([l,c])=>`<span><i style="background:${c}"></i>${l}</span>`).join('') + `<span><i style="width:0;height:12px;border-radius:0;border-left:1.5px dashed var(--fg)"></i>วันสำคัญ</span><span><i style="width:16px;height:3px;border-radius:1px;background:var(--muted)"></i>ช่วงวันที่ (ระหว่าง…ถึง…)</span><span><i style="background:var(--faint)"></i>หนึ่งจุด = หนึ่งข้อความที่ระบุวันที่</span>`;

/* legend: folded away on phones until asked for */
const legTog=document.getElementById('legtog'), gfoot=document.getElementById('gfoot');
legTog.onclick=()=>{ const on=!gfoot.classList.contains('open'); gfoot.classList.toggle('open',on); legTog.setAttribute('aria-expanded',on); };

/* ---------- view switch ---------- */
const nodeLegend = document.getElementById('legend').innerHTML;
function setMode(m, quiet){
  if(state.mode===m && !quiet) return;
  const keep=state.sel;   // the person picked in one view stays picked in the next
  state.mode=m; state.sel=null; state.tev=null;
  ['rel','money','time'].forEach(k=>document.getElementById('mode-'+k).setAttribute('aria-pressed', m===k));
  kindsEl.hidden = m!=='rel'; mkindsEl.hidden = m!=='money'; tkindsEl.hidden = trEl.hidden = m!=='time';
  document.getElementById('labels').closest('label').style.display = m==='time' ? 'none' : '';
  svg.attr('hidden', m==='time' ? '' : null); tsvg.attr('hidden', m==='time' ? null : '');
  if(m!=='time') tLastSec=null;
  document.getElementById('legend').innerHTML = m==='time' ? timeLegend : (m==='money' ? Object.values(MV).map(([l,c])=>`<span><i style="background:${c};border-radius:2px;height:4px;width:16px"></i>${l}</span>`).join('') : '') + nodeLegend;
  svg.attr('aria-label', m==='money' ? 'กราฟเส้นทางการเงิน ใครโอนเงินให้ใคร' : 'กราฟความเชื่อมโยงระหว่างบุคคล');
  if(sim) sim.stop();
  gLinks.selectAll('*').remove(); gNodes.selectAll('*').remove(); gLabels.selectAll('*').remove(); curNodes=[]; curLinks=[];
  if(!quiet){ go(state.sec); if(keep) select(keep); }
}
document.getElementById('mode-rel').onclick=()=>setMode('rel');
document.getElementById('mode-money').onclick=()=>setMode('money');
document.getElementById('mode-time').onclick=()=>setMode('time');

/* ---------- routing ---------- */
function parseHash(){ let h=location.hash.slice(1), mode='rel'; const m=h.match(/-(money|time)$/); if(m){ mode=m[1]; h=h.slice(0,-m[0].length); } return [idByHash.get(h), mode]; }
function go(id, fromHash){
  state.sec=id; state.sel=null;
  toc.querySelectorAll('.sec').forEach(b=>b.setAttribute('aria-current', b.dataset.id===id));
  if(!fromHash){ const h=hashOf(id)+(state.mode==='rel'?'':'-'+state.mode); if(location.hash.slice(1)!==h) history.replaceState(null,'','#'+h); }
  renderSecInfo(); draw(); showSection();
}
window.addEventListener('hashchange',()=>{ const [id,m]=parseHash();
  if(m!==state.mode) setMode(m,true);
  if(id) go(id,true); });
renderToc();
const [hid, hmode] = parseHash();
if(hmode!=='rel') setMode(hmode, true);
go(hid || D.defaultSection || '*', true);
})();
</script>
